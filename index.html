<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8e8e5">
  <meta name="description" content="Una dedicatoria romántica de Cupido para alguien especial.">
  <title>Para ti, mi amor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="love-seal" aria-hidden="true">♥</div>
    <p class="eyebrow">Una pequeña dedicatoria</p>
    <h1>Para ti, <em>mi amor</em></h1>
    <p class="intro">A la persona que hace latir más bonito mi corazón.</p>

    <section class="scene" aria-label="Cupido dispara una flecha de amor que atraviesa un corazón">
      <span class="cupid" aria-hidden="true">👼</span>
      <span class="bow" aria-hidden="true">🏹</span>
      <span class="sparkle sparkle-one" aria-hidden="true">✧</span>
      <span class="sparkle sparkle-two" aria-hidden="true">♡</span>
      <span class="petal petal-one" aria-hidden="true">♥</span>
      <span class="petal petal-two" aria-hidden="true">♥</span>

      <svg class="art" viewBox="0 0 320 150" role="img" aria-labelledby="art-title">
        <title id="art-title">La flecha de Cupido atraviesa un corazón enamorado</title>
        <path class="heart" d="M229 126 190 88C150 49 204 20 229 56c26-36 79-7 39 32Z"/>
        <g class="arrow shooting" aria-hidden="true">
          <path class="arrow-shaft" d="M26 76h163m47 0h22"/>
          <path class="arrow-head" d="m254 68 18 8-18 8"/>
          <path class="arrow-feather" d="m45 76-17-12 4 12-4 12Z"/>
          <path class="arrow-feather" d="m57 76-12-9 3 9-3 9Z"/>
        </g>
        <text class="impact-message" id="impact-message" x="229" y="93" text-anchor="middle" aria-hidden="true">TE AMO</text>
      </svg>
    </section>

    <blockquote class="love-note">
      “Si volviera a empezar, te volvería a elegir<br class="desktop-break">
      en esta vida y en todas las que vengan.”
    </blockquote>
    <p class="status" id="animation-status" aria-live="polite">Con todo mi amor, hoy y siempre.</p>
    <button class="shoot-button" id="shoot-button" type="button">Volver a lanzarte mi flecha <span aria-hidden="true">♥</span></button>
    <p class="signature">Hecho con amor, solo para ti <span aria-hidden="true">♡</span></p>
  </main>
</body>
</html>
